<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	{% seo %}
	{% feed_meta %}
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%233e64ff'/%3E%3Ctext x='32' y='44' font-family='Arial,Helvetica,sans-serif' font-size='36' font-weight='700' fill='%23fff' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>

<body>
	<header class="site-header">
		<div class="wrap site-header-inner">
			<a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈">
				<span class="brand-mark">J</span><span class="brand-name">ustice Hong</span><span class="brand-sub">Blog</span>
			</a>
			<nav class="site-nav" aria-label="주요 메뉴">
				<a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-current"{% endif %}>글 목록</a>
				<a href="{{ site.author.portfolio }}">포트폴리오</a>
				<a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
			</nav>
		</div>
	</header>

	<main class="wrap site-main">
		{{ content }}
	</main>

	<footer class="site-footer">
		<div class="wrap">
			<p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }} ·
				<a href="{{ site.author.portfolio }}">포트폴리오</a> ·
				<a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a> ·
				<a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
		</div>
	</footer>
</body>

</html>
