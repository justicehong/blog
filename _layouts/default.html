<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#faf9f5">
	{% seo %}
	{% feed_meta %}
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141413'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' fill='%23faf9f5' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;500&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>

<body>
	<header class="top-nav">
		<div class="container top-nav-inner">
			<a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈">
				<span class="brand-mark" aria-hidden="true">J</span>
				<span class="brand-name">Justice Hong</span>
				<span class="badge-pill brand-badge">Blog</span>
			</a>
			<nav class="top-nav-links" aria-label="주요 메뉴">
				<a class="nav-link" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>글 목록</a>
				<a class="nav-link nav-link-github" href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
			</nav>
		</div>
	</header>

	<main class="container site-main">
		{{ content }}
	</main>

	<footer class="footer">
		<div class="container">
			<div class="footer-inner">
				<div>
					<span class="footer-brand">Justice Hong</span>
					<p class="footer-desc">{{ site.tagline }}</p>
				</div>
				<ul class="footer-links">
					<li><a href="{{ '/' | relative_url }}">글 목록</a></li>
					<li><a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a></li>
					<li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
				</ul>
			</div>
			<p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
		</div>
	</footer>
</body>

</html>
